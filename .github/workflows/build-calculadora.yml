name: Sync + build da Calculadora

# 1. Sincroniza a main do fork com a Receita Federal
# 2. Gera o banco SQLite (Flyway) e compila o JAR
# 3. Publica JAR + banco na branch "build" (sempre sobrescrita, sem histórico)
#
# Para rodar o resultado em qualquer lugar com Java 21:
#   git clone --depth 1 -b build https://github.com/<owner>/calculadora-rtc-regime-regular calc
#   cd calc && java -Dspring.profiles.active=offline -jar api-regime-geral.jar

on:
  push:
    branches: [testes]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *" # 06:00 em São Paulo

permissions:
  contents: write

concurrency:
  group: build-calculadora
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar main com a Receita Federal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main \
            || echo "::warning::Sync com upstream falhou, seguindo com a main atual"

      - name: Checkout da main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Gerar banco SQLite
        run: |
          mkdir -p calculadora/db
          mvn -B flyway:migrate -Dflyway.configFiles=./flyway/flyway-pro.conf --errors
          ls -lah calculadora/db/calculadora-pro.db

      - name: Compilar JAR
        run: mvn -B clean package -DskipTests

      - name: Publicar na branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          UPSTREAM_SHA=$(git rev-parse --short HEAD)
          mkdir -p out/calculadora/db
          cp target/*.jar out/
          cp calculadora/db/calculadora-pro.db out/calculadora/db/
          cat > out/README.md <<EOF
          # Build da Calculadora de Tributos

          Gerado automaticamente a partir da main (commit ${UPSTREAM_SHA}) em $(date -u +%Y-%m-%dT%H:%MZ).

          \`\`\`bash
          java -Dspring.profiles.active=offline -jar $(cd out && ls *.jar)
          \`\`\`

          API em http://localhost:8080/api, Swagger em http://localhost:8080/api/swagger-ui.html
          EOF
          cd out
          git init -q -b build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build da main ${UPSTREAM_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" build
